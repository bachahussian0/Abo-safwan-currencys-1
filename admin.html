<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Abo Safwan Currency — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f3f6f8;
    color:#17202a;
}

header{
    background:#073b3a;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:6px 0 0;
    font-size:14px;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
    color:#073b3a;
}

input,select,button{
    font-family:inherit;
}

input,select{
    width:100%;
    padding:11px;
    border:1px solid #ccd5d8;
    border-radius:7px;
    font-size:15px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 15px;
    cursor:pointer;
    font-size:14px;
    margin:3px;
}

.btn{
    background:#073b3a;
    color:white;
}

.btn:hover{
    opacity:.9;
}

.green{
    background:#198754;
    color:white;
}

.blue{
    background:#0d6efd;
    color:white;
}

.orange{
    background:#f59f00;
    color:white;
}

.red{
    background:#dc3545;
    color:white;
}

.gray{
    background:#6c757d;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.stat{
    background:#fff;
    padding:18px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.stat strong{
    display:block;
    font-size:23px;
    color:#073b3a;
    margin-top:6px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1050px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
    white-space:nowrap;
}

th{
    background:#073b3a;
    color:white;
}

tr:nth-child(even){
    background:#f8f9fa;
}

.status-pending{
    color:#b26a00;
    font-weight:bold;
}

.status-approved{
    color:#198754;
    font-weight:bold;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:1000;
    overflow:auto;
    padding:20px;
}

.modal-box{
    background:white;
    max-width:650px;
    margin:30px auto;
    padding:20px;
    border-radius:12px;
}

.form-group{
    margin-bottom:12px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.readonly{
    background:#eef2f3;
}

#loginPage{
    max-width:450px;
    margin:70px auto;
}

.hidden{
    display:none!important;
}

.message{
    padding:10px;
    border-radius:7px;
    margin:10px 0;
    display:none;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    background:#f8d7da;
    color:#842029;
}

.search-box{
    display:grid;
    grid-template-columns:1fr auto;
    gap:8px;
}

.received-input{
    width:110px;
    padding:7px;
}

.due-live{
    font-weight:bold;
    color:#dc3545;
}

/* PRINT */
#printArea{
    display:none;
}

@media print{

    body{
        background:white;
    }

    body > *{
        display:none!important;
    }

    #printArea{
        display:block!important;
    }

    @page{
        size:A4 portrait;
        margin:10mm;
    }

    .print-page{
        width:100%;
        color:#000;
    }

    .print-title{
        text-align:center;
        margin-bottom:15px;
    }

    .print-title h1{
        margin:0;
        font-size:22px;
    }

    .print-title p{
        margin:4px 0;
        font-size:13px;
    }

    .print-table{
        width:100%;
        border-collapse:collapse;
        font-size:10px;
    }

    .print-table th,
    .print-table td{
        border:1px solid #000;
        padding:5px;
        text-align:center;
    }

    .print-table th{
        background:#eee!important;
        color:#000!important;
    }

    .print-footer{
        margin-top:15px;
        font-size:11px;
        display:flex;
        justify-content:space-between;
    }

    .single-receipt{
        border:2px solid #000;
        padding:18px;
        width:100%;
    }

    .single-receipt h1{
        text-align:center;
        margin-top:0;
    }

    .single-table{
        width:100%;
        border-collapse:collapse;
        margin-top:15px;
    }

    .single-table td{
        border:1px solid #000;
        padding:9px;
    }

    .single-table td:first-child{
        font-weight:bold;
        width:35%;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="card">

    <h2 style="text-align:center;">🔐 Admin Login</h2>

    <div class="form-group">
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="Admin Email">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Password">
    </div>

    <button class="btn" style="width:100%;" onclick="adminLogin()">
        🔐 Login
    </button>

    <div id="loginMessage" class="message"></div>
</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

<header>
    <h1>Abo Safwan Currency</h1>
    <p>Saudi Riyal Exchange Service — Admin Panel</p>
</header>

<div class="container">

    <!-- RATE -->
    <div class="card">

        <h2>💱 موجودہ سعودی ریال ریٹ</h2>

        <div class="grid">

            <div>
                <label>1 SAR =</label>
                <input id="rateInput" type="number" step="0.01">
            </div>

            <div style="display:flex;align-items:end;">
                <button class="green" onclick="updateRate()">
                    💾 ریٹ محفوظ کریں
                </button>
            </div>

        </div>

        <div id="rateMessage" class="message"></div>

    </div>


    <!-- STATS -->
    <div class="grid">

        <div class="stat">
            کل اکاؤنٹس
            <strong id="statRecords">0</strong>
        </div>

        <div class="stat">
            کل ریال
            <strong id="statSar">0</strong>
        </div>

        <div class="stat">
            کل رقم
            <strong id="statTotal">0</strong>
        </div>

        <div class="stat">
            وصول
            <strong id="statReceived">0</strong>
        </div>

        <div class="stat">
            بقایا
            <strong id="statDue">0</strong>
        </div>

    </div>


    <!-- SEARCH -->
    <div class="card">

        <h2>🔎 کسٹمر تلاش کریں</h2>

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="کسٹمر نام یا موبائل نمبر"
                oninput="filterRecords()"
            >

            <button class="gray" onclick="clearSearch()">
                صاف کریں
            </button>

        </div>

    </div>


    <!-- RECORDS -->
    <div class="card">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            flex-wrap:wrap;
        ">

            <h2>📋 تمام اکاؤنٹس</h2>

            <button class="blue" onclick="printAllRecords()">
                🖨️ تمام اکاؤنٹس پرنٹ
            </button>

        </div>

        <div id="recordsMessage" class="message"></div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>کسٹمر</th>
                        <th>موبائل</th>
                        <th>وصول کنندہ</th>
                        <th>ریال</th>
                        <th>ریٹ</th>
                        <th>کل رقم</th>
                        <th>وصول</th>
                        <th>بقایا</th>
                        <th>اسٹیٹس</th>
                        <th>تاریخ</th>
                        <th>WhatsApp</th>
                        <th>اپڈیٹ</th>
                        <th>پرنٹ</th>
                    </tr>
                </thead>

                <tbody id="recordsBody"></tbody>

            </table>

        </div>

    </div>

    <div style="text-align:center;margin:20px;">
        <button class="red" onclick="logout()">
            🚪 Logout
        </button>
    </div>

</div>
</div>


<!-- UPDATE MODAL -->
<div id="updateModal" class="modal">

    <div class="modal-box">

        <h2>✏️ اکاؤنٹ اپڈیٹ</h2>

        <input id="editId" type="hidden">

        <div class="form-group">
            <label>کسٹمر نام</label>
            <input id="editCustomer">
        </div>

        <div class="form-group">
            <label>موبائل نمبر</label>
            <input id="editMobile">
        </div>

        <div class="form-group">
            <label>وصول کنندہ</label>
            <input id="editReceiver">
        </div>

        <div class="grid">

            <div class="form-group">
                <label>ریال</label>
                <input
                    id="editAmount"
                    type="number"
                    step="0.01"
                    oninput="calculateEdit()"
                >
            </div>

            <div class="form-group">
                <label>ریٹ</label>
                <input
                    id="editRate"
                    type="number"
                    step="0.01"
                    oninput="calculateEdit()"
                >
            </div>

        </div>

        <div class="form-group">
            <label>کل رقم</label>
            <input
                id="editTotal"
                class="readonly"
                type="number"
                readonly
            >
        </div>

        <div class="form-group">
            <label>وصول</label>

            <input
                id="editReceived"
                type="number"
                step="0.01"
                value="0"
                oninput="calculateEdit()"
            >
        </div>

        <div class="form-group">

            <label>بقایا</label>

            <input
                id="editDue"
                class="readonly"
                type="number"
                readonly
            >

        </div>

        <div class="form-group">

            <label>اسٹیٹس</label>

            <select id="editStatus">
                <option value="pending">زیرِ کارروائی</option>
                <option value="approved">منظور شدہ</option>
            </select>

        </div>

        <div id="updateMessage" class="message"></div>

        <div style="text-align:center;">

            <button class="green" onclick="saveUpdate()">
                💾 محفوظ کریں
            </button>

            <button class="gray" onclick="closeUpdate()">
                بند کریں
            </button>

        </div>

    </div>

</div>


<!-- PRINT AREA -->
<div id="printArea"></div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://fcrgyjxdmcbqxqizuoto.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Uunl1_GNG6s1hnWiEyjFmw_nQELLr89";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ADMIN UID */

const ADMIN_UID =
"d4b5b48a-d8d2-4b84-b21e-f25ffa1db734";


let allRecords = [];
let currentRate = 75;


/* =====================================================
   HELPERS
===================================================== */

function showMessage(id,text,type="success"){

    const el=document.getElementById(id);

    el.className="message "+type;

    el.textContent=text;

    el.style.display="block";

    setTimeout(()=>{
        el.style.display="none";
    },4000);
}


function money(value){

    return Number(value || 0)
        .toLocaleString("en-US",{
            minimumFractionDigits:0,
            maximumFractionDigits:2
        });
}


function escapeHtml(value){

    if(value === null || value === undefined)
        return "";

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =====================================================
   LOGIN
===================================================== */

async function adminLogin(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if(!email || !password){

        showMessage(
            "loginMessage",
            "Email اور Password درج کریں",
            "error"
        );

        return;
    }

    const {data,error} =
        await supabaseClient.auth.signInWithPassword({
            email:email,
            password:password
        });

    if(error){

        showMessage(
            "loginMessage",
            error.message,
            "error"
        );

        return;
    }

    if(!data.user || data.user.id !== ADMIN_UID){

        await supabaseClient.auth.signOut();

        showMessage(
            "loginMessage",
            "یہ اکاؤنٹ Admin نہیں ہے",
            "error"
        );

        return;
    }

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("adminPanel")
        .classList.remove("hidden");

    await initializeAdmin();
}


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin(){

    const {
        data:{
            session
        }
    } = await supabaseClient.auth.getSession();

    if(
        session &&
        session.user &&
        session.user.id === ADMIN_UID
    ){

        document
            .getElementById("loginPage")
            .classList.add("hidden");

        document
            .getElementById("adminPanel")
            .classList.remove("hidden");

        await initializeAdmin();

    }else{

        document
            .getElementById("loginPage")
            .classList.remove("hidden");

        document
            .getElementById("adminPanel")
            .classList.add("hidden");
    }
}


/* =====================================================
   INITIALIZE
===================================================== */

async function initializeAdmin(){

    await loadRate();

    await loadRecords();

}


/* =====================================================
   LOAD RATE
===================================================== */

async function loadRate(){

    const {
        data,
        error
    } = await supabaseClient
        .from("currency_rates")
        .select("*")
        .eq("currency_from","SAR")
        .eq("currency_to","PKR")
        .eq("is_active",true)
        .maybeSingle();

    if(error){

        console.error(error);

        return;
    }

    if(data){

        currentRate =
            Number(data.rate);

        document
            .getElementById("rateInput")
            .value=currentRate;
    }
}


/* =====================================================
   UPDATE RATE
===================================================== */

async function updateRate(){

    const newRate =
        Number(
            document
            .getElementById("rateInput")
            .value
        );

    if(!newRate || newRate <= 0){

        showMessage(
            "rateMessage",
            "درست ریٹ درج کریں",
            "error"
        );

        return;
    }

    const {
        error:deactivateError
    } = await supabaseClient
        .from("currency_rates")
        .update({
            is_active:false
        })
        .eq("currency_from","SAR")
        .eq("currency_to","PKR")
        .eq("is_active",true);

    if(deactivateError){

        showMessage(
            "rateMessage",
            deactivateError.message,
            "error"
        );

        return;
    }

    const {
        error:insertError
    } = await supabaseClient
        .from("currency_rates")
        .insert({
            rate:newRate,
            currency_from:"SAR",
            currency_to:"PKR",
            is_active:true,
            created_by:ADMIN_UID
        });

    if(insertError){

        showMessage(
            "rateMessage",
            insertError.message,
            "error"
        );

        return;
    }

    currentRate=newRate;

    showMessage(
        "rateMessage",
        "نیا ریٹ کامیابی سے محفوظ ہوگیا"
    );

    await loadRecords();
}


/* =====================================================
   LOAD RECORDS
===================================================== */

async function loadRecords(){

    const {
        data,
        error
    } = await supabaseClient
        .from("currency_records")
        .select("*")
        .order("record_date",{
            ascending:false
        });

    if(error){

        console.error(error);

        showMessage(
            "recordsMessage",
            error.message,
            "error"
        );

        return;
    }

    allRecords=data || [];

    renderRecords(allRecords);

    updateStats(allRecords);
}


/* =====================================================
   RENDER RECORDS
===================================================== */

function renderRecords(records){

    const tbody =
        document.getElementById("recordsBody");

    tbody.innerHTML="";

    if(!records.length){

        tbody.innerHTML=`
            <tr>
                <td colspan="14">
                    کوئی ریکارڈ نہیں ملا
                </td>
            </tr>
        `;

        return;
    }

    records.forEach((r,index)=>{

        const total =
            Number(r.amount || 0) *
            Number(r.rate || 0);

        const received =
            Number(r.total_received || 0);

        const due =
            Math.max(total-received,0);

        const status =
            r.status === "approved"
            ? `<span class="status-approved">✅ منظور شدہ</span>`
            : `<span class="status-pending">⏳ زیرِ کارروائی</span>`;

        const date =
            r.record_date
            ? new Date(r.record_date)
                .toLocaleString("ur-PK")
            : "";

        tbody.innerHTML += `

        <tr>

            <td>${index+1}</td>

            <td>
                ${escapeHtml(r.customer)}
            </td>

            <td>
                ${escapeHtml(r.mobile)}
            </td>

            <td>
                ${escapeHtml(r.receiver)}
            </td>

            <td>
                ${money(r.amount)}
            </td>

            <td>
                ${money(r.rate)}
            </td>

            <td>
                ${money(total)}
            </td>

            <td>
                <input
                    class="received-input"
                    type="number"
                    min="0"
                    step="0.01"
                    value="${received}"
                    data-id="${r.id}"
                    oninput="liveTableDue(this, ${total}, '${r.id}')"
                >
            </td>

            <td
                id="due-${r.id}"
                class="due-live"
            >
                ${money(due)}
            </td>

            <td>
                ${status}
            </td>

            <td>
                ${date}
            </td>

            <td>

                <button
                    class="whatsapp"
                    onclick="openWhatsApp('${r.mobile}')"
                >
                    📱 WhatsApp
                </button>

            </td>

            <td>

                <button
                    class="orange"
                    onclick="openUpdate('${r.id}')"
                >
                    ✏️ اپڈیٹ
                </button>

            </td>

            <td>

                <button
                    class="blue"
                    onclick="printSingle('${r.id}')"
                >
                    🖨️ پرنٹ
                </button>

            </td>

        </tr>

        `;
    });
}


/* =====================================================
   LIVE TABLE DUE
===================================================== */

function liveTableDue(input,total,id){

    let received =
        Number(input.value || 0);

    if(received < 0){
        received=0;
        input.value=0;
    }

    const due =
        Math.max(total-received,0);

    const dueElement =
        document.getElementById("due-"+id);

    if(dueElement){

        dueElement.textContent =
            money(due);
    }
}


/* =====================================================
   STATS
===================================================== */

function updateStats(records){

    let sar=0;
    let total=0;
    let received=0;
    let due=0;

    records.forEach(r=>{

        const amount =
            Number(r.amount || 0);

        const rate =
            Number(r.rate || 0);

        const t =
            amount*rate;

        const rec =
            Number(r.total_received || 0);

        sar += amount;
        total += t;
        received += rec;
        due += Math.max(t-rec,0);

    });

    document
        .getElementById("statRecords")
        .textContent=records.length;

    document
        .getElementById("statSar")
        .textContent=money(sar);

    document
        .getElementById("statTotal")
        .textContent=money(total);

    document
        .getElementById("statReceived")
        .textContent=money(received);

    document
        .getElementById("statDue")
        .textContent=money(due);
}


/* =====================================================
   SEARCH
===================================================== */

function filterRecords(){

    const search =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if(!search){

        renderRecords(allRecords);
        return;
    }

    const filtered =
        allRecords.filter(r=>{

            const customer =
                String(r.customer || "")
                .toLowerCase();

            const mobile =
                String(r.mobile || "")
                .toLowerCase();

            return(
                customer.includes(search) ||
                mobile.includes(search)
            );
        });

    renderRecords(filtered);
}


function clearSearch(){

    document
        .getElementById("searchInput")
        .value="";

    renderRecords(allRecords);
}


/* =====================================================
   UPDATE MODAL
===================================================== */

function openUpdate(id){

    const record =
        allRecords.find(r=>r.id===id);

    if(!record){

        alert("ریکارڈ نہیں ملا");
        return;
    }

    document
        .getElementById("editId")
        .value=record.id;

    document
        .getElementById("editCustomer")
        .value=record.customer || "";

    document
        .getElementById("editMobile")
        .value=record.mobile || "";

    document
        .getElementById("editReceiver")
        .value=record.receiver || "";

    document
        .getElementById("editAmount")
        .value=record.amount || 0;

    document
        .getElementById("editRate")
        .value=record.rate || currentRate;

    document
        .getElementById("editReceived")
        .value=record.total_received || 0;

    document
        .getElementById("editStatus")
        .value=record.status || "pending";

    calculateEdit();

    document
        .getElementById("updateModal")
        .style.display="block";
}


function closeUpdate(){

    document
        .getElementById("updateModal")
        .style.display="none";
}


/* =====================================================
   LIVE CALCULATION IN UPDATE
===================================================== */

function calculateEdit(){

    const amount =
        Number(
            document
            .getElementById("editAmount")
            .value || 0
        );

    const rate =
        Number(
            document
            .getElementById("editRate")
            .value || 0
        );

    let received =
        Number(
            document
            .getElementById("editReceived")
            .value || 0
        );

    if(received < 0){

        received=0;

        document
            .getElementById("editReceived")
            .value=0;
    }

    const total =
        amount*rate;

    const due =
        Math.max(total-received,0);

    document
        .getElementById("editTotal")
        .value=total.toFixed(2);

    document
        .getElementById("editDue")
        .value=due.toFixed(2);
}


/* =====================================================
   SAVE UPDATE
===================================================== */

async function saveUpdate(){

    const id =
        document
        .getElementById("editId")
        .value;

    const customer =
        document
        .getElementById("editCustomer")
        .value
        .trim();

    const mobile =
        document
        .getElementById("editMobile")
        .value
        .trim();

    const receiver =
        document
        .getElementById("editReceiver")
        .value
        .trim();

    const amount =
        Number(
            document
            .getElementById("editAmount")
            .value || 0
        );

    const rate =
        Number(
            document
            .getElementById("editRate")
            .value || 0
        );

    const received =
        Number(
            document
            .getElementById("editReceived")
            .value || 0
        );

    const status =
        document
        .getElementById("editStatus")
        .value;

    if(!customer){

        showMessage(
            "updateMessage",
            "کسٹمر نام ضروری ہے",
            "error"
        );

        return;
    }

    if(amount < 0 || rate <= 0 || received < 0){

        showMessage(
            "updateMessage",
            "رقم درست درج کریں",
            "error"
        );

        return;
    }

    const total =
        amount*rate;

    const due =
        Math.max(total-received,0);

    const {
        error
    } = await supabaseClient
        .from("currency_records")
        .update({

            customer:customer,

            mobile:mobile,

            receiver:receiver,

            amount:amount,

            rate:rate,

            total:total,

            total_received:received,

            total_due:due,

            status:status

        })
        .eq("id",id);

    if(error){

        showMessage(
            "updateMessage",
            error.message,
            "error"
        );

        return;
    }

    showMessage(
        "updateMessage",
        "اکاؤنٹ کامیابی سے اپڈیٹ ہوگیا"
    );

    await loadRecords();

    setTimeout(()=>{
        closeUpdate();
    },800);
}


/* =====================================================
   WHATSAPP
===================================================== */

function openWhatsApp(number){

    if(!number){

        alert("اس کسٹمر کا موبائل نمبر موجود نہیں");
        return;
    }

    let phone =
        String(number)
        .trim()
        .replace(/[^\d+]/g,"");

    if(phone.startsWith("+")){

        phone =
            phone.substring(1);

    }else if(phone.startsWith("00")){

        phone =
            phone.substring(2);

    }else if(phone.startsWith("03")){

        phone =
            "92"+phone.substring(1);

    }

    const url =
        "https://wa.me/"+phone;

    window.open(url,"_blank");
}
