<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abo Safwan Currency</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(135deg,#eef8f2,#f8fff9);
    color:#173b2a;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:15px;
}

.header{
    background:linear-gradient(135deg,#075e36,#0b9658);
    color:white;
    padding:28px 18px;
    text-align:center;
    border-radius:0 0 28px 28px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.logo{
    width:68px;
    height:68px;
    margin:auto;
    margin-bottom:10px;
    border-radius:50%;
    background:white;
    color:#08713f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
}

.header h1{
    font-size:24px;
    margin-bottom:5px;
}

.header p{
    font-size:13px;
    opacity:.9;
}

.card{
    background:white;
    margin-top:18px;
    padding:20px;
    border-radius:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.title{
    font-size:19px;
    font-weight:bold;
    color:#075e36;
    border-right:4px solid #d6a928;
    padding-right:10px;
    margin-bottom:18px;
}

.info{
    background:#f1faf5;
    border:1px solid #d7eee1;
    border-radius:13px;
    padding:13px;
    margin-bottom:10px;
}

.info small{
    display:block;
    color:#777;
    margin-bottom:4px;
}

.info strong{
    font-size:16px;
    color:#174f34;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin:14px 0 7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #cbded3;
    border-radius:12px;
    background:#fbfefc;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#0b8f54;
    box-shadow:0 0 0 3px rgba(11,143,84,.10);
}

.rate{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border-radius:14px;
    background:#fff9e5;
    border:1px solid #ead48c;
    margin-bottom:15px;
}

.rate span:first-child{
    color:#705a13;
    font-size:14px;
}

.rate strong{
    color:#80620b;
    font-size:20px;
}

.total{
    text-align:center;
    margin-top:16px;
    padding:17px;
    border-radius:15px;
    background:#ecfaf1;
    border:2px solid #bde4cc;
}

.total small{
    color:#5c7465;
}

.total strong{
    display:block;
    color:#075e36;
    font-size:27px;
    margin-top:4px;
}

.btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:15px;
    margin-top:16px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    color:white;
    background:linear-gradient(135deg,#08713f,#0b9b5c);
    box-shadow:0 5px 12px rgba(8,113,63,.2);
}

.btn-secondary{
    color:#075e36;
    background:#eef5f1;
}

.message{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:14px;
    text-align:center;
    line-height:1.8;
}

.success{
    display:block;
    background:#eaf9ef;
    border:1px solid #b9e3c7;
    color:#075e36;
}

.error{
    display:block;
    background:#fff0f0;
    border:1px solid #efbcbc;
    color:#9b2020;
}

.tracking{
    margin-top:10px;
    padding:14px;
    background:#fffbea;
    border:2px dashed #d5ae2e;
    border-radius:12px;
}

.tracking small{
    display:block;
    color:#777;
}

.tracking strong{
    display:block;
    margin-top:5px;
    color:#765900;
    font-size:20px;
    direction:ltr;
    word-break:break-all;
}

.hidden{
    display:none!important;
}

.logout{
    text-align:center;
    margin:20px 0;
}

.logout button{
    border:0;
    background:none;
    color:#a82020;
    cursor:pointer;
    font-size:14px;
}

footer{
    text-align:center;
    color:#888;
    font-size:11px;
    padding:10px 0 25px;
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->

<div id="authSection">

    <div class="header">
        <div class="logo">AS</div>
        <h1>Abo Safwan Currency</h1>
        <p>Saudi Riyal Exchange Service</p>
    </div>

    <div class="container">

        <div class="card">

            <div class="title">کسٹمر لاگ اِن</div>

            <label>موبائل نمبر</label>
            <input
                id="loginMobile"
                type="tel"
                inputmode="numeric"
                placeholder="موبائل نمبر">

            <label>4 ہندسوں کا PIN</label>
            <input
                id="loginPin"
                type="password"
                inputmode="numeric"
                maxlength="4"
                placeholder="PIN">

            <button class="btn btn-primary"
                    onclick="loginCustomer()">
                لاگ اِن
            </button>

            <button class="btn btn-secondary"
                    onclick="showRegister()">
                نیا اکاؤنٹ بنائیں
            </button>

            <div id="loginMessage"
                 class="message"></div>

        </div>


        <div id="registerCard"
             class="card hidden">

            <div class="title">نیا اکاؤنٹ</div>

            <label>کسٹمر نام</label>
            <input
                id="registerName"
                type="text"
                placeholder="نام">

            <label>موبائل نمبر</label>
            <input
                id="registerMobile"
                type="tel"
                inputmode="numeric"
                placeholder="موبائل نمبر">

            <label>4 ہندسوں کا PIN</label>
            <input
                id="registerPin"
                type="password"
                inputmode="numeric"
                maxlength="4"
                placeholder="PIN">

            <button class="btn btn-primary"
                    onclick="registerCustomer()">
                اکاؤنٹ بنائیں
            </button>

            <button class="btn btn-secondary"
                    onclick="showLogin()">
                واپس
            </button>

            <div id="registerMessage"
                 class="message"></div>

        </div>

    </div>
</div>


<!-- CUSTOMER DASHBOARD -->

<div id="dashboard" class="hidden">

    <div class="header">

        <div class="logo">AS</div>

        <h1>Abo Safwan Currency</h1>

        <p>Saudi Riyal Exchange Service</p>

    </div>


    <div class="container">

        <!-- CUSTOMER INFO -->

        <div class="card">

            <div class="title">
                کسٹمر معلومات
            </div>

            <div class="info">

                <small>کسٹمر نام</small>

                <strong id="customerName">
                    ---
                </strong>

            </div>

            <div class="info">

                <small>موبائل نمبر</small>

                <strong id="customerMobile">
                    ---
                </strong>

            </div>

        </div>


        <!-- NEW ORDER -->

        <div class="card">

            <div class="title">
                نیا آرڈر
            </div>

            <div class="rate">

                <span>
                    سعودی ریال کا ریٹ
                </span>

                <strong>
                    1 ریال =
                    <span id="rate">73</span>
                    روپے
                </strong>

            </div>


            <label>
                وصول کنندہ کا نام
            </label>

            <input
                id="receiver"
                type="text"
                placeholder="وصول کنندہ کا نام">


            <label>
                رقم — سعودی ریال
            </label>

            <input
                id="amount"
                type="number"
                min="1"
                step="0.01"
                placeholder="مثلاً 50"
                oninput="calculateTotal()">


            <div class="total">

                <small>
                    کل پاکستانی
                </small>

                <strong>
                    <span id="total">0</span>
                    روپے
                </strong>

            </div>


            <button
                id="orderButton"
                class="btn btn-primary"
                onclick="createOrder()">

                آرڈر کریں

            </button>


            <div id="orderMessage"
                 class="message">
            </div>

        </div>


        <!-- TRACKING SEARCH ONLY -->

        <div class="card">

            <div class="title">
                Tracking Number تلاش کریں
            </div>

            <label>
                Tracking Number
            </label>

            <input
                id="trackingSearch"
                type="text"
                dir="ltr"
                placeholder="AS-YYYYMMDD-XXXXXXXX">

            <button
                class="btn btn-primary"
                onclick="searchTracking()">

                🔍 تلاش کریں

            </button>


            <div id="trackingMessage"
                 class="message">
            </div>


            <div id="trackingResult">
            </div>

        </div>


        <div class="logout">

            <button onclick="logoutCustomer()">
                لاگ آؤٹ
            </button>

        </div>


        <footer>
            Abo Safwan Currency
        </footer>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://fcrgyjxdmcbqxqizuoto.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Uunl1_GNG6s1hnWiEyjFmw_nQELLr89";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   CUSTOMER
========================= */

let customer = null;
let currentRate = 73;


/* =========================
   START
========================= */

window.addEventListener(
    "load",
    async function(){

        const saved =
            localStorage.getItem(
                "aboSafwanCustomer"
            );

        if(saved){

            try{

                customer =
                    JSON.parse(saved);

                if(
                    customer &&
                    customer.customer_id
                ){

                    showDashboard();

                    await loadRate();

                    return;
                }

            }catch(e){

                localStorage.removeItem(
                    "aboSafwanCustomer"
                );

            }

        }

        showAuth();

    }
);


/* =========================
   AUTH
========================= */

function showAuth(){

    document
    .getElementById("authSection")
    .classList.remove("hidden");

    document
    .getElementById("dashboard")
    .classList.add("hidden");

}


function showDashboard(){

    document
    .getElementById("authSection")
    .classList.add("hidden");

    document
    .getElementById("dashboard")
    .classList.remove("hidden");

    document
    .getElementById("customerName")
    .textContent =
        customer.name || "---";

    document
    .getElementById("customerMobile")
    .textContent =
        customer.mobile || "---";

}


/* =========================
   LOGIN
========================= */

async function loginCustomer(){

    const mobile =
        document
        .getElementById("loginMobile")
        .value
        .trim();

    const pin =
        document
        .getElementById("loginPin")
        .value
        .trim();

    if(!mobile){

        message(
            "loginMessage",
            "موبائل نمبر درج کریں",
            false
        );

        return;
    }

    if(!/^\d{4}$/.test(pin)){

        message(
            "loginMessage",
            "PIN چار ہندسوں کا ہونا چاہیے",
            false
        );

        return;
    }

    try{

        const {data,error} =
            await supabaseClient.rpc(
                "customer_login",
                {
                    p_mobile:mobile,
                    p_pin:pin
                }
            );

        if(error) throw error;

        if(!data || !data.success){

            message(
                "loginMessage",
                "موبائل نمبر یا PIN غلط ہے",
                false
            );

            return;
        }

        customer = data;

        localStorage.setItem(
            "aboSafwanCustomer",
            JSON.stringify(customer)
        );

        showDashboard();

        await loadRate();

    }catch(error){

        console.error(error);

        message(
            "loginMessage",
            "لاگ اِن میں مسئلہ آیا",
            false
        );

    }

}


/* =========================
   REGISTER
========================= */

async function registerCustomer(){

    const name =
        document
        .getElementById("registerName")
        .value
        .trim();

    const mobile =
        document
        .getElementById("registerMobile")
        .value
        .trim();

    const pin =
        document
        .getElementById("registerPin")
        .value
        .trim();

    if(!name){

        message(
            "registerMessage",
            "نام درج کریں",
            false
        );

        return;
    }

    if(!mobile){

        message(
            "registerMessage",
            "موبائل نمبر درج کریں",
            false
        );

        return;
    }

    if(!/^\d{4}$/.test(pin)){

        message(
            "registerMessage",
            "PIN چار ہندسوں کا ہونا چاہیے",
            false
        );

        return;
    }

    try{

        const {data,error} =
            await supabaseClient.rpc(
                "create_customer_account",
                {
                    p_name:name,
                    p_mobile:mobile,
                    p_pin:pin
                }
            );

        if(error) throw error;

        if(!data || !data.success){

            message(
                "registerMessage",
                data?.message ||
                "اکاؤنٹ نہیں بن سکا",
                false
            );

            return;
        }

        customer = data;

        localStorage.setItem(
            "aboSafwanCustomer",
            JSON.stringify(customer)
        );

        showDashboard();

        await loadRate();

    }catch(error){

        console.error(error);

        message(
            "registerMessage",
            "اکاؤنٹ بنانے میں مسئلہ آیا",
            false
        );

    }

}


/* =========================
   RATE
========================= */

async function loadRate(){

    try{

        const {data,error} =
            await supabaseClient
            .from("currency_rates")
            .select("rate")
            .eq("currency_from","SAR")
            .eq("currency_to","PKR")
            .eq("is_active",true)
            .limit(1)
            .maybeSingle();

        if(error) throw error;

        currentRate =
            Number(
                data?.rate || 73
            );

        document
        .getElementById("rate")
        .textContent =
            number(currentRate);

        calculateTotal();

    }catch(error){

        currentRate = 73;

        document
        .getElementById("rate")
        .textContent = "73";

    }

}


/* =========================
   TOTAL
========================= */

function calculateTotal(){

    const amount =
        Number(
            document
            .getElementById("amount")
            .value
        ) || 0;

    const total =
        amount * currentRate;

    document
    .getElementById("total")
    .textContent =
        number(total);

}


/* =========================
   ORDER
========================= */

async function createOrder(){

    if(
        !customer ||
        !customer.customer_id
    ){

        alert("پہلے لاگ اِن کریں");

        return;
    }

    const receiver =
        document
        .getElementById("receiver")
        .value
        .trim();

    const amount =
        Number(
            document
            .getElementById("amount")
            .value
        );

    if(!receiver){

        message(
            "orderMessage",
            "وصول کنندہ کا نام درج کریں",
            false
        );

        return;
    }

    if(!amount || amount <= 0){

        message(
            "orderMessage",
            "ریال کی درست رقم درج کریں",
            false
        );

        return;
    }

    const button =
        document.getElementById(
            "orderButton"
        );

    try{

        button.disabled = true;
        button.textContent =
            "آرڈر درج ہو رہا ہے...";

        const {data,error} =
            await supabaseClient.rpc(
                "create_customer_currency_order",
                {
                    p_customer_id:
                        customer.customer_id,

                    p_receiver:
                        receiver,

                    p_amount:
                        amount
                }
            );

        if(error) throw error;

        let order = data;

        if(Array.isArray(order)){
            order = order[0];
        }

        if(!order){
            throw new Error(
                "Order not returned"
            );
        }

        const tracking =
            order.tracking_number;

        const box =
            document.getElementById(
                "orderMessage"
            );

        box.className =
            "message success";

        box.innerHTML = `
            آرڈر کامیابی سے درج ہوگیا۔

            <div class="tracking">

                <small>
                    Tracking Number
                </small>

                <strong>
                    ${escapeHTML(
                        tracking || "---"
                    )}
                </strong>

            </div>
        `;

        document
        .getElementById("receiver")
        .value = "";

        document
        .getElementById("amount")
        .value = "";

        document
        .getElementById("total")
        .textContent = "0";

    }catch(error){

        console.error(error);

        message(
            "orderMessage",
            "آرڈر درج نہیں ہو سکا",
            false
        );

    }finally{

        button.disabled = false;
        button.textContent =
            "آرڈر کریں";

    }

}


/* =========================
   TRACKING SEARCH
========================= */

async function searchTracking(){

    if(
        !customer ||
        !customer.customer_id
    ){

        message(
            "trackingMessage",
            "پہلے لاگ اِن کریں",
            false
        );

        return;
    }

    const tracking =
        document
        .getElementById("trackingSearch")
        .value
        .trim();

    if(!tracking){

        message(
            "trackingMessage",
            "Tracking Number درج کریں",
            false
        );

        return;
    }

    try{

        const {data,error} =
            await supabaseClient.rpc(
                "search_customer_tracking",
                {
                    p_customer_id:
                        customer.customer_id,

                    p_tracking_number:
                        tracking
                }
            );

        if(error) throw error;

        if(!data || data.length === 0){

            document
            .getElementById(
                "trackingResult"
            )
            .innerHTML = "";

            message(
                "trackingMessage",
                "Tracking Number نہیں ملا",
                false
            );

            return;
        }

        const order = data[0];

        document
        .getElementById(
            "trackingMessage"
        )
        .className =
            "message success";

        document
        .getElementById(
            "trackingMessage"
        )
        .textContent =
            "آرڈر مل گیا۔";

        document
        .getElementById(
            "trackingResult"
        )
        .innerHTML = `

            <div class="info">

                <small>
                    Tracking Number
                </small>

                <strong dir="ltr">
                    ${escapeHTML(
                        order.tracking_number
                    )}
                </strong>

            </div>

            <div class="info">

                <small>
                    وصول کنندہ
                </small>

                <strong>
                    ${escapeHTML(
                        order.receiver || "---"
                    )}
                </strong>

            </div>

            <div class="info">

                <small>
                    ریال
                </small>

                <strong>
                    ${number(
                        order.amount || 0
                    )}
                </strong>

            </div>

            <div class="info">

                <small>
                    ریٹ
                </small>

                <strong>
                    ${number(
                        order.rate || 0
                    )} روپے
                </strong>

            </div>

            <div class="total">

                <small>
                    کل پاکستانی
                </small>

                <strong>
                    ${number(
                        order.total || 0
                    )} روپے
                </strong>

            </div>

        `;

    }catch(error){

        console.error(error);

        message(
            "trackingMessage",
            "تلاش میں مسئلہ آیا",
            false
        );

    }

}


/* =========================
   LOGOUT
========================= */

function logoutCustomer(){

    localStorage.removeItem(
        "aboSafwanCustomer"
    );

    customer = null;

    showAuth();

}


/* =========================
   REGISTER / LOGIN SWITCH
========================= */

function showRegister(){

    document
    .getElementById("registerCard")
    .classList.remove("hidden");

}

function showLogin(){

    document
    .getElementById("registerCard")
    .classList.add("hidden");

}


/* =========================
   MESSAGE
========================= */

function message(
    id,
    text,
    success
){

    const el =
        document.getElementById(id);

    el.className =
        "message " +
        (success ? "success" : "error");

    el.textContent = text;

}


/* =========================
   NUMBER
========================= */

function number(value){

    return Number(value || 0)
        .toLocaleString(
            "en-US",
            {
                maximumFractionDigits:2
            }
        );

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
