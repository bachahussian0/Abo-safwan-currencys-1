<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abo Safwan Currency - Customer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f1f6f5;
    color:#173b39;
}

header{
    background:#073b3a;
    color:white;
    text-align:center;
    padding:22px 15px;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:7px 0 0;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:16px;
    box-shadow:0 4px 15px #00000012;
}

h2{
    margin-top:0;
    color:#073b3a;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    margin-top:6px;
    border:1px solid #ccd7d5;
    border-radius:9px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:0;
    border-radius:9px;
    background:#087f5b;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

.blue{
    background:#1971c2;
}

.red{
    background:#c92a2a;
}

.gray{
    background:#6c757d;
}

.rate-box{
    background:#e6f5f1;
    border-radius:12px;
    padding:18px;
    text-align:center;
    margin:15px 0;
}

.rate{
    font-size:30px;
    font-weight:bold;
    color:#087f5b;
}

.total-box{
    background:#073b3a;
    color:white;
    padding:18px;
    border-radius:12px;
    text-align:center;
    margin-top:15px;
}

.total{
    font-size:28px;
    font-weight:bold;
}

.message{
    padding:12px;
    border-radius:9px;
    margin-top:12px;
    display:none;
}

.success{
    background:#d3f9d8;
    color:#176b2c;
}

.error{
    background:#ffe3e3;
    color:#9b2226;
}

.tracking{
    background:#fff3bf;
    color:#6b4f00;
    padding:18px;
    text-align:center;
    border-radius:12px;
    margin-top:15px;
}

.tracking-number{
    font-size:22px;
    font-weight:bold;
    direction:ltr;
}

.hidden{
    display:none;
}

.info{
    background:#f5f5f5;
    padding:12px;
    border-radius:9px;
    margin-top:10px;
}

@media(max-width:450px){
    header h1{
        font-size:21px;
    }

    .rate{
        font-size:26px;
    }
}
</style>
</head>

<body>

<header>
    <h1>💱 Abo Safwan Currency</h1>
    <p>Saudi Riyal Exchange Service</p>
</header>


<div class="container">


<!-- LOGIN -->
<div id="loginSection" class="card">

    <h2>🔐 Customer Login</h2>

    <label>Email</label>
    <input
        id="email"
        type="email"
        placeholder="اپنا Email لکھیں">

    <label>Password</label>
    <input
        id="password"
        type="password"
        placeholder="Password">

    <button onclick="login()">
        Login
    </button>

    <button class="blue" onclick="signup()">
        نیا Customer Account بنائیں
    </button>

    <div id="loginMessage" class="message"></div>

</div>


<!-- CUSTOMER AREA -->
<div id="customerSection" class="hidden">


<!-- CURRENT RATE -->
<div class="card">

    <h2>💱 موجودہ ریٹ</h2>

    <div class="rate-box">

        <div>
            1 سعودی ریال =
        </div>

        <div class="rate" id="rate">
            ---
        </div>

        <div>
            پاکستانی روپے
        </div>

    </div>

</div>


<!-- ORDER FORM -->
<div class="card">

    <h2>📝 نیا آرڈر</h2>

    <label>نام</label>
    <input
        id="customerName"
        type="text"
        placeholder="اپنا نام">

    <label>موبائل نمبر</label>
    <input
        id="mobile"
        type="tel"
        placeholder="03XXXXXXXXX">

    <label>حصول کنندہ کا نام</label>
    <input
        id="receiver"
        type="text"
        placeholder="حصول کنندہ کا نام">

    <label>سعودی ریال کی رقم</label>
    <input
        id="amount"
        type="number"
        min="1"
        step="0.01"
        placeholder="مثلاً 1000"
        oninput="calculateTotal()">

    <div class="total-box">

        <div>
            کل پاکستانی رقم
        </div>

        <div class="total" id="total">
            0 PKR
        </div>

    </div>

    <button onclick="placeOrder()">
        🛒 آرڈر کریں
    </button>

    <div id="orderMessage" class="message"></div>

    <div id="trackingBox" class="tracking hidden">

        <div>
            آپ کا Tracking Number
        </div>

        <div
            id="trackingNumber"
            class="tracking-number">
        </div>

        <p>
            اس نمبر کو محفوظ رکھیں۔
        </p>

    </div>

</div>


<!-- TRACKING SEARCH -->
<div class="card">

    <h2>🔎 اپنا آرڈر تلاش کریں</h2>

    <input
        id="trackingSearch"
        type="text"
        placeholder="Tracking Number">

    <button class="blue" onclick="searchOrder()">
        آرڈر تلاش کریں
    </button>

    <div id="searchMessage" class="message"></div>

    <div id="orderResult" class="info hidden"></div>

</div>


<button class="red" onclick="logout()">
    Logout
</button>

</div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://bvypnhintuiejqpkpjox.supabase.co";

const SUPABASE_KEY =
"sb_publishable_T_rZSYLkDynbSXi1JflY0Q_IPFcyfZa";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   CURRENT RATE
========================================= */

let currentRate = 0;


/* =========================================
   CHECK LOGIN
========================================= */

async function checkLogin(){

    const {data} =
        await supabaseClient.auth.getSession();

    if(data.session){

        showCustomer();

        await loadRate();

    }
}


/* =========================================
   SIGN UP
========================================= */

async function signup(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    if(!email || !password){

        showMessage(
            message,
            "Email اور Password درج کریں",
            "error"
        );

        return;
    }

    if(password.length < 6){

        showMessage(
            message,
            "Password کم از کم 6 حروف کا ہونا چاہیے",
            "error"
        );

        return;
    }

    const {error} =
        await supabaseClient.auth.signUp({
            email:email,
            password:password
        });

    if(error){

        showMessage(
            message,
            error.message,
            "error"
        );

        return;
    }

    showMessage(
        message,
        "Account بن گیا ہے۔ اب Login کریں۔",
        "success"
    );
}


/* =========================================
   LOGIN
========================================= */

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    if(!email || !password){

        showMessage(
            message,
            "Email اور Password درج کریں",
            "error"
        );

        return;
    }

    const {data,error} =
        await supabaseClient.auth.signInWithPassword({
            email:email,
            password:password
        });

    if(error){

        showMessage(
            message,
            error.message,
            "error"
        );

        return;
    }

    if(data.session){

        showCustomer();

        await loadRate();
    }
}


/* =========================================
   SHOW CUSTOMER
========================================= */

function showCustomer(){

    document
        .getElementById("loginSection")
        .classList.add("hidden");

    document
        .getElementById("customerSection")
        .classList.remove("hidden");
}


/* =========================================
   LOAD RATE
========================================= */

async function loadRate(){

    const {data,error} =
        await supabaseClient
        .from("currency_rates")
        .select("rate")
        .eq("currency_from","SAR")
        .eq("currency_to","PKR")
        .eq("is_active",true)
        .order("created_at",{ascending:false})
        .limit(1)
        .maybeSingle();

    if(error){

        console.error(error);

        return;
    }

    if(data){

        currentRate =
            Number(data.rate);

        document
            .getElementById("rate")
            .textContent =
            currentRate.toLocaleString();
    }
}


/* =========================================
   CALCULATE
========================================= */

function calculateTotal(){

    const amount =
        Number(
            document
            .getElementById("amount")
            .value
        );

    const total =
        amount * currentRate;

    document
        .getElementById("total")
        .textContent =
        total.toLocaleString(
            "en-PK",
            {
                maximumFractionDigits:2
            }
        ) + " PKR";
}


/* =========================================
   PLACE ORDER
========================================= */

async function placeOrder(){

    const customer =
        document
        .getElementById("customerName")
        .value.trim();

    const mobile =
        document
        .getElementById("mobile")
        .value.trim();

    const receiver =
        document
        .getElementById("receiver")
        .value.trim();

    const amount =
        Number(
            document
            .getElementById("amount")
            .value
        );

    const message =
        document
        .getElementById("orderMessage");

    if(!customer){

        showMessage(
            message,
            "نام درج کریں",
            "error"
        );

        return;
    }

    if(!mobile){

        showMessage(
            message,
            "موبائل نمبر درج کریں",
            "error"
        );

        return;
    }

    if(!receiver){

        showMessage(
            message,
            "حصول کنندہ کا نام درج کریں",
            "error"
        );

        return;
    }

    if(!amount || amount <= 0){

        showMessage(
            message,
            "ریال کی درست رقم درج کریں",
            "error"
        );

        return;
    }


    const {data:userData} =
        await supabaseClient.auth.getUser();

    if(!userData.user){

        showMessage(
            message,
            "پہلے Login کریں",
            "error"
        );

        return;
    }


    /*
      اہم:
      Rate یہاں Customer سے نہیں لیا جا رہا۔
      Database Function خود موجودہ Admin Rate
      استعمال کرے گا۔
    */

    const {data,error} =
        await supabaseClient
        .rpc(
            "create_currency_order",
            {
                p_customer:customer,
                p_mobile:mobile,
                p_receiver:receiver,
                p_amount:amount
            }
        );


    if(error){

        showMessage(
            message,
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        message,
        "آپ کا آرڈر کامیابی سے جمع ہوگیا ہے",
        "success"
    );


    if(data){

        document
            .getElementById("trackingNumber")
            .textContent =
            data.tracking_number;

        document
            .getElementById("trackingBox")
            .classList.remove("hidden");
    }


    document
        .getElementById("amount")
        .value = "";

    calculateTotal();
}


/* =========================================
   SEARCH ORDER
========================================= */

async function searchOrder(){

    const tracking =
        document
        .getElementById("trackingSearch")
        .value
        .trim();

    const message =
        document
        .getElementById("searchMessage");

    const result =
        document
        .getElementById("orderResult");

    if(!tracking){

        showMessage(
            message,
            "Tracking Number درج کریں",
            "error"
        );

        return;
    }


    const {data,error} =
        await supabaseClient
        .rpc(
            "get_my_currency_order",
            {
                p_tracking_number:tracking
            }
        );


    if(error){

        result.classList.add("hidden");

        showMessage(
            message,
            "آرڈر نہیں ملا",
            "error"
        );

        return;
    }


    if(!data){

        result.classList.add("hidden");

        showMessage(
            message,
            "آرڈر نہیں ملا",
            "error"
        );

        return;
    }


    const status =
        data.status === "approved"
        ? "✅ منظور شدہ"
        : "🟡 زیرِ اجازت";


    result.innerHTML = `

        <h3>📋 آرڈر کی تفصیل</h3>

        <p>
            <b>Tracking Number:</b><br>
            ${safe(data.tracking_number)}
        </p>

        <p>
            <b>نام:</b>
            ${safe(data.customer)}
        </p>

        <p>
            <b>موبائل:</b>
            ${safe(data.mobile)}
        </p>

        <p>
            <b>حصول کنندہ:</b>
            ${safe(data.receiver)}
        </p>

        <p>
            <b>ریال:</b>
            ${money(data.amount)} SAR
        </p>

        <p>
            <b>ریٹ:</b>
            ${money(data.rate)} PKR
        </p>

        <p>
            <b>کل پاکستانی رقم:</b>
            ${money(data.total)} PKR
        </p>

        <p>
            <b>وصول:</b>
            ${money(data.total_received)} PKR
        </p>

        <p>
            <b>بقایا:</b>
            ${money(data.total_due)} PKR
        </p>

        <p>
            <b>حالت:</b>
            ${status}
        </p>

        <p>
            <b>تاریخ:</b>
            ${formatDate(data.record_date)}
        </p>
    `;

    result.classList.remove("hidden");
}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();
}


/* =========================================
   HELPERS
========================================= */

function money(value){

    return Number(value || 0)
        .toLocaleString(
            "en-PK",
            {
                maximumFractionDigits:2
            }
        );
}


function formatDate(value){

    if(!value) return "-";

    return new Date(value)
        .toLocaleString("ur-PK");
}


function safe(value){

    if(value === null ||
       value === undefined){

        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function showMessage(element,text,type){

    element.textContent = text;

    element.className =
        "message " +
        (
            type === "success"
            ? "success"
            : "error"
        );

    element.style.display = "block";

    setTimeout(()=>{
        element.style.display = "none";
    },5000);
}


/* =========================================
   START
========================================= */

checkLogin();

</script>

</body>
</html>
